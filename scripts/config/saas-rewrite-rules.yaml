version: 1
enabled: true

rules:
  # ---- R-DEV-MD: DEVELOPMENT.md 参照恒久化 (cmd_368 HF2 暫定削除の後継) ----
  - id: R-DEV-MD-EN-BATCH
    description: "Remove 'See DEVELOPMENT.md for configuration details.' from EN ngsiv2"
    enabled: true
    skip_in_code: true
    skip_in_changelog: true
    matchers:
      - pattern: 'See DEVELOPMENT\.md for configuration details\.'
        replacement: ''
        scope: ['docs/en/api-reference/ngsiv2.md']

  - id: R-DEV-MD-EN-PAGINATION
    description: "Replace DEVELOPMENT.md API Spec reference with Pagination link in EN"
    enabled: true
    skip_in_code: true
    skip_in_changelog: true
    matchers:
      - pattern: 'For details, see the "API Specification" section in DEVELOPMENT\.md\.'
        replacement: 'For details, see [Pagination](/en/api-reference/pagination).'
        scope: ['docs/en/core-concepts/ngsiv2-vs-ngsild.md']

  - id: R-DEV-MD-JA-BATCH
    description: "Remove 'DEVELOPMENT.md を参照してください' from JA ngsiv2"
    enabled: true
    skip_in_code: true
    skip_in_changelog: true
    matchers:
      - pattern: '設定の詳細については DEVELOPMENT\.md を参照してください。'
        replacement: ''
        scope: ['docs/ja/api-reference/ngsiv2.md']

  - id: R-DEV-MD-JA-PAGINATION
    description: "Replace DEVELOPMENT.md API Spec reference with Pagination link in JA"
    enabled: true
    skip_in_code: true
    skip_in_changelog: true
    matchers:
      - pattern: 'DEVELOPMENT\.md の「API 仕様」セクションを参照してください。'
        replacement: '[ページネーション](/ja/api-reference/pagination)を参照してください。'
        scope: ['docs/ja/core-concepts/ngsiv2-vs-ngsild.md']

  # ---- R-SAM-BATCH: MaxBatchSize SAM パラメータ言及削除 ----
  - id: R-SAM-BATCH-EN
    description: "Remove MaxBatchSize SAM parameter mention from EN ngsiv2"
    enabled: true
    skip_in_code: true
    skip_in_changelog: true
    matchers:
      - pattern: ', configurable up to 10,000 via the `MaxBatchSize` SAM parameter'
        replacement: ''
        scope: ['docs/en/api-reference/ngsiv2.md']
      - pattern: ', configurable up to 10,000\)'
        replacement: ')'
        scope: ['docs/en/api-reference/ngsiv2.md']

  - id: R-SAM-BATCH-JA
    description: "Remove MaxBatchSize SAM parameter mention from JA ngsiv2"
    enabled: true
    skip_in_code: true
    skip_in_changelog: true
    matchers:
      - pattern: '、`MaxBatchSize` SAM パラメータで最大 10,000 まで設定可能'
        replacement: ''
        scope: ['docs/ja/api-reference/ngsiv2.md']
      - pattern: '、最大 10,000 まで設定可能'
        replacement: ''
        scope: ['docs/ja/api-reference/ngsiv2.md']

  # ---- R-SAM-DEPLOY: EventStreamingEnabled SAM deploy 手順 → SaaS では既定で有効 ----
  - id: R-SAM-DEPLOY
    description: "EventStreamingEnabled SAM deploy block → SaaS default enabled note (en/ja)"
    enabled: true
    skip_in_code: false
    skip_in_changelog: true
    matchers:
      - pattern: 'Set the `EventStreamingEnabled` parameter to `true` in the SAM template and deploy\.\s*```bash\s*sam deploy -t infrastructure/template\.yaml \\\s*--parameter-overrides EventStreamingEnabled=true\s*```'
        replacement: 'Event streaming is enabled by default in GeonicDB SaaS. No additional configuration is required.'
        scope: ['docs/en/features/subscriptions.md']
      - pattern: 'SAM テンプレートで `EventStreamingEnabled` パラメータを `true` に設定してデプロイします。\s*```bash\s*sam deploy -t infrastructure/template\.yaml \\\s*--parameter-overrides EventStreamingEnabled=true\s*```'
        replacement: 'GeonicDB SaaS ではイベントストリーミングは既定で有効です。追加の設定は不要です。'
        scope: ['docs/ja/features/subscriptions.md']

  # ---- R-ENV-ADMIN: ADMIN_ALLOWED_IPS env var 言及に SaaS 注記追加 ----
  - id: R-ENV-ADMIN
    description: "ADMIN_ALLOWED_IPS env var section → prepend SaaS note (en/ja, admin+endpoints)"
    enabled: true
    skip_in_code: false  # full-content matching required for cross-line negative lookbehind
    skip_in_changelog: true
    matchers:
      - pattern: '(?<!Contact Geolonia support for details\.\n\n)Restrict admin API access to specific IP addresses or CIDR ranges using the `ADMIN_ALLOWED_IPS` environment variable\.'
        replacement: "**SaaS users**: This is configured via the tenant settings API. Contact Geolonia support for details.\n\nRestrict admin API access to specific IP addresses or CIDR ranges using the `ADMIN_ALLOWED_IPS` environment variable."
        scope: ['docs/en/api-reference/admin.md']
      - pattern: '(?<!Contact Geolonia support for details\.\n\n)By setting the `ADMIN_ALLOWED_IPS` environment variable, you can restrict access to the Admin API \(`/admin/\*`\) to specific IP addresses:'
        replacement: "**SaaS users**: This is configured via the tenant settings API. Contact Geolonia support for details.\n\nBy setting the `ADMIN_ALLOWED_IPS` environment variable, you can restrict access to the Admin API (`/admin/*`) to specific IP addresses:"
        scope: ['docs/en/api-reference/endpoints.md']
      - pattern: '(?<!詳細は Geolonia サポートにお問い合わせください。\n\n)`ADMIN_ALLOWED_IPS` 環境変数を使用して、管理 API へのアクセスを特定の IP アドレスまたは CIDR 範囲に制限できます。'
        replacement: "**SaaS 利用者の方へ**: これは tenant 設定 API 経由で設定されます。詳細は Geolonia サポートにお問い合わせください。\n\n`ADMIN_ALLOWED_IPS` 環境変数を使用して、管理 API へのアクセスを特定の IP アドレスまたは CIDR 範囲に制限できます。"
        scope: ['docs/ja/api-reference/admin.md']
      - pattern: '(?<!詳細は Geolonia サポートにお問い合わせください。\n\n)`ADMIN_ALLOWED_IPS` 環境変数を設定することで、Admin API \(`/admin/\*`\) へのアクセスを特定の IP アドレスに制限できます:'
        replacement: "**SaaS 利用者の方へ**: これは tenant 設定 API 経由で設定されます。詳細は Geolonia サポートにお問い合わせください。\n\n`ADMIN_ALLOWED_IPS` 環境変数を設定することで、Admin API (`/admin/*`) へのアクセスを特定の IP アドレスに制限できます:"
        scope: ['docs/ja/api-reference/endpoints.md']

  # ---- R-ENV-TABLE: endpoints.md env var 表に SaaS 注記追加 ----
  - id: R-ENV-TABLE
    description: "endpoints.md env var table → append SaaS note after ADMIN_ALLOWED_IPS row (en/ja)"
    enabled: true
    skip_in_code: false  # full-content matching required for negative lookahead across lines
    skip_in_changelog: true
    matchers:
      - pattern: '\| `ADMIN_ALLOWED_IPS` \| - \| IPs/CIDRs allowed to access the Admin API \(comma-separated\) \|(?!\n\n> \*\*SaaS users\*\*)'
        replacement: "| `ADMIN_ALLOWED_IPS` | - | IPs/CIDRs allowed to access the Admin API (comma-separated) |\n\n> **SaaS users**: These environment variables are managed via the GeonicDB SaaS console. Direct configuration is not required."
        scope: ['docs/en/api-reference/endpoints.md']
      - pattern: '\| `ADMIN_ALLOWED_IPS` \| - \| 管理 API へのアクセスを許可する IP/CIDR\(カンマ区切り\) \|(?!\n\n> \*\*SaaS 利用者の方へ\*\*)'
        replacement: "| `ADMIN_ALLOWED_IPS` | - | 管理 API へのアクセスを許可する IP/CIDR(カンマ区切り) |\n\n> **SaaS 利用者の方へ**: これらの環境変数は GeonicDB SaaS コンソールで管理されます。直接設定は不要です。"
        scope: ['docs/ja/api-reference/endpoints.md']

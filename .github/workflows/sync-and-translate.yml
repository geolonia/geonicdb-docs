name: Sync and Translate GeonicDB Docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [geonicdb-docs-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout geonicdb-docs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout geolonia/geonicdb (docs/ and CHANGELOG.md via sparse-checkout)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: geolonia/geonicdb
          token: ${{ secrets.GEONICDB_PAT }}
          path: .geonicdb-upstream
          sparse-checkout: |
            docs
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run sync-docs
        run: GEONICDB_REPO_PATH=.geonicdb-upstream pnpm run sync-docs

      - name: Detect changed files
        id: detect
        run: |
          # sync-docs copies English source docs into docs/en/ paths
          # Check for any .md file changes in docs/en/
          CHANGED=$(git diff --name-only -- 'docs/' | grep '\.md$' || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- 'docs/' | grep '\.md$' || true)
          ALL_CHANGED=$(echo -e "${CHANGED}\n${UNTRACKED}" | sort -u | grep -v '^$' || true)

          if [ -z "$ALL_CHANGED" ]; then
            echo "No documentation changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files:"
            echo "$ALL_CHANGED"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$ALL_CHANGED" > /tmp/changed_files.txt
            # Build file list for PR body
            {
              echo "file_list<<EOF"
              echo "$ALL_CHANGED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify yuuhitsu is available
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          if ! npx yuuhitsu --help > /dev/null 2>&1; then
            echo "::error::yuuhitsu CLI is not available. Check installation."
            exit 1
          fi
          echo "yuuhitsu CLI is available"

      - name: Translate English docs to Japanese (with P-A1/P-A2/P-A3 guards)
        if: steps.detect.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: "--stack-trace-limit=100"
        run: |
          # sync-docs copies English source docs into docs/en/.
          # translate-protected.ts wraps yuuhitsu with:
          #   P-A2: bullet sentinel protection (preserve list newlines)
          #   P-A3: table pipe protection (preserve table structure)
          #   P-A1: truncation + completeness validation after translation
          EN_FILES=$(grep '^docs/en/' /tmp/changed_files.txt || true)
          if [ -z "$EN_FILES" ]; then
            echo "No docs/en/ files to translate"
            exit 0
          fi
          TOTAL=$(echo "$EN_FILES" | wc -l)
          FAILED=0
          echo "Node.js: $(node --version)"
          echo "yuuhitsu version: $(npx yuuhitsu --version 2>/dev/null || echo 'unknown')"

          echo "Translating $TOTAL files to Japanese (with pipeline guards)..."
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              ja_file="${file/docs\/en\//docs\/ja\/}"
              echo "Translating (protected): $file -> $ja_file"
              mkdir -p "$(dirname "$ja_file")"
              if ! npx tsx scripts/translate-protected.ts \
                  --input "$file" --lang ja --output "$ja_file"; then
                echo "::error::Failed to translate $file to Japanese"
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "$EN_FILES"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED/$TOTAL translations failed"
            exit 1
          fi
          echo "All $TOTAL files translated to Japanese successfully"

      - name: Post-translation quality fixes (docs/ja/ and docs/en/)
        if: steps.detect.outputs.has_changes == 'true'
        run: npx tsx scripts/fix-doc-quality.ts

      - name: Glossary check — block tier
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          BLOCK_FAILED=0
          while IFS= read -r -d '' f; do
            if ! npx --yes @geolonia/yuuhitsu@0.1.11 glossary check \
                --input "$f" \
                --glossary glossary.yaml \
                --lang ja \
                --severity-filter block \
                --format text; then
              echo "::error file=$f::Glossary block violation detected"
              BLOCK_FAILED=$((BLOCK_FAILED + 1))
            fi
          done < <(find docs/ja -name "*.md" -print0)
          if [ "$BLOCK_FAILED" -gt 0 ]; then
            echo "::error::$BLOCK_FAILED file(s) have block-tier violations — blocking CI"
            exit 1
          fi

      - name: Glossary fix — auto-fix tier
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          while IFS= read -r -d '' f; do
            npx --yes @geolonia/yuuhitsu@0.1.11 glossary fix \
              --input "$f" \
              --glossary glossary.yaml \
              --lang ja
          done < <(find docs/ja -name "*.md" -print0)
          if ! git diff --quiet docs/ja/; then
            echo "glossary auto-fix: changes detected — will be included in PR"
            git diff --name-only docs/ja/
          else
            echo "glossary auto-fix: no changes needed"
          fi

      - name: Glossary check — warn tier
        if: steps.detect.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          WARN_COUNT=0
          while IFS= read -r -d '' f; do
            if ! npx --yes @geolonia/yuuhitsu@0.1.11 glossary check \
                --input "$f" \
                --glossary glossary.yaml \
                --lang ja \
                --severity-filter warn \
                --format text; then
              echo "::warning file=$f::Glossary warn violation detected"
              WARN_COUNT=$((WARN_COUNT + 1))
            fi
          done < <(find docs/ja -name "*.md" -print0)
          echo "Glossary warn-tier: $WARN_COUNT file(s) have warn violations (CI not blocked)"

      - name: Glossary SARIF — generate
        if: steps.detect.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/glossary-sarif
          while IFS= read -r -d '' f; do
            safename=$(echo "$f" | sed 's|/|_|g')
            npx --yes @geolonia/yuuhitsu@0.1.11 glossary check \
              --input "$f" \
              --glossary glossary.yaml \
              --lang ja \
              --format sarif \
              > "/tmp/glossary-sarif/${safename}.sarif" 2>/dev/null || true
          done < <(find docs/ja -name "*.md" -print0)

      - name: Glossary SARIF — upload artifact
        if: steps.detect.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glossary-sarif
          path: /tmp/glossary-sarif/
          if-no-files-found: ignore

      - name: Build verification
        if: steps.detect.outputs.has_changes == 'true'
        run: pnpm docs:build

      - name: Create Pull Request
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DOCS_WRITE_PAT }}
          commit-message: "docs: sync and translate from geonicdb/docs (${{ github.event.client_payload.sha || 'manual' }})"
          title: "docs: sync and translate from geonicdb/docs"
          body: |
            ## Automated Sync & Translation

            **Trigger**: ${{ github.event_name }}
            **GeonicDB SHA**: ${{ github.event.client_payload.sha || 'N/A (manual dispatch)' }}

            ### Changed files
            ${{ steps.detect.outputs.file_list }}

            ### Process
            1. Synced English source docs from geolonia/geonicdb → docs/en/
            2. Translated English docs to Japanese via yuuhitsu → docs/ja/
            3. Build verification passed
          branch: docs/auto-sync-translate
          base: main
          labels: documentation,automated
